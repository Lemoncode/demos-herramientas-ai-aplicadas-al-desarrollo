name: opencode (ci-subagents-opencode, on-demand)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          # NaN (nan.builders) provider config lives in the committed file
          # referenced by OPENCODE_CONFIG. See ci-subagents-opencode/README.md.
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          OPENCODE_CONFIG: ${{ github.workspace }}/ci-subagents-opencode/opencode.ci.json
        with:
          model: nan/deepseek-v4-flash
