name: opencode (ci-subagents-opencode, on-demand)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      # The fixer edits the PR branch and the action commits + pushes the
      # result, so this workflow needs write access. The auto-review workflow
      # stays read-only (`contents: read`).
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Same agents and `pr-review` skill as the auto-review workflow. opencode
      # only walks up from the cwd (the repository root here) looking for
      # `.opencode`, so stage the demo's AI setup there for the job.
      - name: Stage opencode AI setup
        run: |
          mkdir -p .opencode
          cp -R ci-subagents-opencode/.opencode/. .opencode/

      # The action commits whatever the agent edited (`git add` + `git commit`
      # + `git push` to the PR branch), and `git commit` needs an identity on
      # the runner. The staged `.opencode/` copy is gitignored, so it never
      # lands in the commit.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          # `use_github_token` is deliberately NOT set here, so the action still
          # exchanges the OIDC token and refuses to run for commenters without
          # write access. GITHUB_TOKEN is passed only so the `gh` CLI is
          # authenticated when the agent posts inline review comments.
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          OPENCODE_CONFIG: ${{ github.workspace }}/ci-subagents-opencode/opencode.ci.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: nan/deepseek-v4-flash
          # On-demand is the write entry point: the comment is the task, the
          # agent edits the PR branch, and the action commits the result.
          agent: ci-pr-fixer
