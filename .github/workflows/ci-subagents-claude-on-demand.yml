name: Claude Assistant (ci-subagents-claude, on-demand)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-response:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Same agents and coordinator skill as the auto-review workflow, staged
      # from `.github/` into the `.claude/` layout Claude Code discovers. Ask
      # for the whole review (`@claude run the pr-review skill`) or for one
      # agent (`@claude react-reviewer, look at the hook rules`).
      - name: Stage agents and coordinator skill for Claude Code
        run: |
          mkdir -p .claude/agents .claude/skills
          for f in ci-subagents-claude/.github/agents/*.agent.md; do
            cp "$f" ".claude/agents/$(basename "${f%.agent.md}").md"
          done
          cp -R ci-subagents-claude/.github/skills/. .claude/skills/

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --allowedTools "Skill,Task,Agent,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh repo view:*)"
