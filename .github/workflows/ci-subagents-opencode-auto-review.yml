name: opencode Review (ci-subagents-opencode)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ci-subagents-opencode/**'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          # NaN (nan.builders) is an OpenAI-compatible provider, so it can't
          # be inferred from the env var name alone. It is declared in the
          # committed config referenced by OPENCODE_CONFIG below.
          # See ci-subagents-opencode/README.md.
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          OPENCODE_CONFIG: ${{ github.workspace }}/ci-subagents-opencode/opencode.ci.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: nan/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Look for security issues
            - Suggest improvements
